sonar.projectKey=aceest-fitness
sonar.projectName=ACEest Fitness & Gym
sonar.projectVersion=2.0.0

sonar.sources=.
sonar.inclusions=**/*.py
sonar.exclusions=tests/**,venv/**,.venv/**,reports/**
sonar.tests=tests
sonar.test.inclusions=tests/**/*.py
sonar.python.version=3.12

sonar.python.coverage.reportPaths=reports/coverage.xml
sonar.python.xunit.reportPath=reports/pytest-report.xml

# Version snapshots in versions/ are intentional copies of earlier releases.
sonar.cpd.exclusions=versions/**
sonar.sourceEncoding=UTF-8
