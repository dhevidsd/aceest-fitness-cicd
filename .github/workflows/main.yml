name: CI/CD Pipeline

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: Build & Lint and Automated Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8 (syntax errors fail the build)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --max-line-length=100 --statistics --exit-zero

      - name: Run Pytest
        run: pytest -v

  docker:
    name: Docker Image Assembly & Containerized Tests
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t aceest-fitness .

      - name: Run Pytest inside the container
        run: docker run --rm aceest-fitness pytest -v

      - name: Verify container starts and /health responds
        run: |
          docker run -d --name aceest -p 5000:5000 aceest-fitness
          sleep 5
          curl --fail --retry 5 --retry-delay 2 http://localhost:5000/health
          docker stop aceest
