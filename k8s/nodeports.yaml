# NodePort services exposing each strategy's live endpoint directly.
apiVersion: v1
kind: Service
metadata:
  name: aceest-rolling-nodeport
  namespace: aceest
spec:
  type: NodePort
  selector: {app: aceest-fitness, strategy: rolling}
  ports: [{port: 80, targetPort: http, nodePort: 30080}]
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-bluegreen-nodeport
  namespace: aceest
spec:
  type: NodePort
  selector: {app: aceest-fitness, strategy: bluegreen, track: blue}
  ports: [{port: 80, targetPort: http, nodePort: 30081}]
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-canary-nodeport
  namespace: aceest
spec:
  type: NodePort
  selector: {app: aceest-fitness, strategy: canary}
  ports: [{port: 80, targetPort: http, nodePort: 30082}]
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-ab-nodeport
  namespace: aceest
spec:
  type: NodePort
  selector: {app: aceest-fitness, strategy: abtest, track: variant-a}
  ports: [{port: 80, targetPort: http, nodePort: 30083}]
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-shadow-nodeport
  namespace: aceest
spec:
  type: NodePort
  selector: {app: aceest-fitness, strategy: shadow, track: primary}
  ports: [{port: 80, targetPort: http, nodePort: 30084}]
