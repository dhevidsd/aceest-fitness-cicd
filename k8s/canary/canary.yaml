# Canary Release: ingress-nginx sends canary-weight % of traffic to the new version.
# Rollback: set canary-weight to 0 (scripts/rollback.sh canary).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-canary-stable
  namespace: aceest
  labels: {app: aceest-fitness, strategy: canary, track: stable}
spec:
  replicas: 3
  revisionHistoryLimit: 10
  selector:
    matchLabels: {app: aceest-fitness, strategy: canary, track: stable}
  template:
    metadata:
      labels: {app: aceest-fitness, strategy: canary, track: stable}
    spec:
      containers:
        - name: aceest-fitness
          image: dhevishreeds/aceest-fitness:1.1.0
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 5000, name: http}]
          env:
            - {name: DEPLOYMENT_TRACK, value: "stable"}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-canary-stable
  namespace: aceest
  labels: {app: aceest-fitness, strategy: canary, track: stable}
spec:
  selector: {app: aceest-fitness, strategy: canary, track: stable}
  ports: [{port: 80, targetPort: http, name: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-canary
  namespace: aceest
  labels: {app: aceest-fitness, strategy: canary, track: canary}
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels: {app: aceest-fitness, strategy: canary, track: canary}
  template:
    metadata:
      labels: {app: aceest-fitness, strategy: canary, track: canary}
    spec:
      containers:
        - name: aceest-fitness
          image: dhevishreeds/aceest-fitness:2.0.0
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 5000, name: http}]
          env:
            - {name: DEPLOYMENT_TRACK, value: "canary"}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-canary
  namespace: aceest
  labels: {app: aceest-fitness, strategy: canary, track: canary}
spec:
  selector: {app: aceest-fitness, strategy: canary, track: canary}
  ports: [{port: 80, targetPort: http, name: http}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-canary-stable
  namespace: aceest

spec:
  ingressClassName: nginx
  rules:
    - host: canary.aceest.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: aceest-canary-stable, port: {number: 80}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-canary
  namespace: aceest
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-weight: "20"
spec:
  ingressClassName: nginx
  rules:
    - host: canary.aceest.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: aceest-canary, port: {number: 80}}
