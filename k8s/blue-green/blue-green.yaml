# Blue-Green: two full environments; the live Service selector points at one colour.
# Cut-over/rollback = patch Service selector 'track' between blue and green.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-blue
  namespace: aceest
  labels: {app: aceest-fitness, strategy: bluegreen, track: blue}
spec:
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels: {app: aceest-fitness, strategy: bluegreen, track: blue}
  template:
    metadata:
      labels: {app: aceest-fitness, strategy: bluegreen, track: blue}
    spec:
      containers:
        - name: aceest-fitness
          image: dhevishreeds/aceest-fitness:1.1.0
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 5000, name: http}]
          env:
            - {name: DEPLOYMENT_TRACK, value: "blue"}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-blue
  namespace: aceest
  labels: {app: aceest-fitness, strategy: bluegreen, track: blue}
spec:
  selector: {app: aceest-fitness, strategy: bluegreen, track: blue}
  ports: [{port: 80, targetPort: http, name: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-green
  namespace: aceest
  labels: {app: aceest-fitness, strategy: bluegreen, track: green}
spec:
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels: {app: aceest-fitness, strategy: bluegreen, track: green}
  template:
    metadata:
      labels: {app: aceest-fitness, strategy: bluegreen, track: green}
    spec:
      containers:
        - name: aceest-fitness
          image: dhevishreeds/aceest-fitness:2.0.0
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 5000, name: http}]
          env:
            - {name: DEPLOYMENT_TRACK, value: "green"}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-green
  namespace: aceest
  labels: {app: aceest-fitness, strategy: bluegreen, track: green}
spec:
  selector: {app: aceest-fitness, strategy: bluegreen, track: green}
  ports: [{port: 80, targetPort: http, name: http}]
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-bluegreen
  namespace: aceest
  labels: {app: aceest-fitness, strategy: bluegreen}
spec:
  selector: {app: aceest-fitness, strategy: bluegreen, track: blue}
  ports: [{port: 80, targetPort: http, name: http}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-bluegreen
  namespace: aceest

spec:
  ingressClassName: nginx
  rules:
    - host: bluegreen.aceest.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: aceest-bluegreen, port: {number: 80}}
---
