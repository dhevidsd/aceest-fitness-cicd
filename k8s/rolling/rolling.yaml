# Rolling Update: pods replaced gradually (maxUnavailable=0 => zero downtime).
# Rollback: kubectl -n aceest rollout undo deployment/aceest-rolling
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-rolling
  namespace: aceest
  labels: {app: aceest-fitness, strategy: rolling, track: stable}
spec:
  replicas: 4
  revisionHistoryLimit: 10
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app: aceest-fitness, strategy: rolling, track: stable}
  template:
    metadata:
      labels: {app: aceest-fitness, strategy: rolling, track: stable}
    spec:
      containers:
        - name: aceest-fitness
          image: dhevishreeds/aceest-fitness:1.1.0
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 5000, name: http}]
          env:
            - {name: DEPLOYMENT_TRACK, value: "stable"}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-rolling
  namespace: aceest
  labels: {app: aceest-fitness, strategy: rolling, track: stable}
spec:
  selector: {app: aceest-fitness, strategy: rolling, track: stable}
  ports: [{port: 80, targetPort: http, name: http}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-rolling
  namespace: aceest

spec:
  ingressClassName: nginx
  rules:
    - host: rolling.aceest.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: aceest-rolling, port: {number: 80}}
